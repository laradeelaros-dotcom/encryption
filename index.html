<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="description" content="A simple message encryption tool using the Caesar cipher method.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Lara Santiago">
    <link rel="stylesheet" href="style.css">
    <title>Message Encryption</title>

    
</head>
<body>
    <h1>Encrypt</h1>
    <details id="help">
    <summary>Help?</summary>
<ul>
    <li>Write the text in the main box.</li>
    <li>Set the numerical offset.</li>
    <li>Click Encrypt to encrypt or Decrypt to decrypt.</li>
</ul>
</details>
    <textarea id="textarea" placeholder="type your message here"></textarea>

    <p>select the shift key</p>
    <input id="numberKey" type="number" placeholder="ex: 3">
<div class="button-group">
    <button id="button_encrypt">Encrypt</button>
    <button id="button_decrypt">Decrypt</button>
</div>
    <h2>Result </h2>
    <p id="outputResult">Your message will appear here.</p>
    <script src="script.js"></script>
</body>
</html>
